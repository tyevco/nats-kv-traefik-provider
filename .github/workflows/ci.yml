name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Check vendor directory is up to date
        run: |
          go mod vendor
          git diff --exit-code vendor/

      - name: Run tests
        run: go test -v -race -cover ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  yaegi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install yaegi
        run: go install github.com/traefik/yaegi/cmd/yaegi@latest

      - name: Run yaegi test
        run: |
          GOPATH=$(mktemp -d)
          mkdir -p "$GOPATH/src/github.com/tyevco"
          ln -s "$GITHUB_WORKSPACE" "$GOPATH/src/github.com/tyevco/nats-kv-traefik-provider"
          cd "$GOPATH/src/github.com/tyevco/nats-kv-traefik-provider"
          GOPATH="$GOPATH" yaegi test .
