name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Verify module
        run: |
          go mod verify
          go mod download

      - name: Run tests
        run: go test -v -race -cover ./...

      - name: Build plugin package
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          ARCHIVE_NAME="nats-kv-traefik-provider-${VERSION}"

          # Create a clean package directory
          mkdir -p "dist/${ARCHIVE_NAME}"

          # Copy plugin source files (Traefik loads plugins from source via Yaegi)
          cp -r provider.go go.mod go.sum .traefik.yml vendor/ "dist/${ARCHIVE_NAME}/"
          cp LICENSE README.md "dist/${ARCHIVE_NAME}/" 2>/dev/null || true

          # Create tarball
          cd dist
          tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

          # Create checksums
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.sha256sum"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          ARCHIVE_NAME="nats-kv-traefik-provider-${VERSION}"

          gh release upload "${VERSION}" \
            "dist/${ARCHIVE_NAME}.tar.gz" \
            "dist/${ARCHIVE_NAME}.sha256sum" \
            --clobber
